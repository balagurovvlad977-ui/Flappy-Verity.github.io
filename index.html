

<!--Всем привет от создателя (Влада)-->
<!DOCTYPE html>
<html lang="ru">
<head>
   <meta charset="UTF-8">
   <meta name="author" content="Villager0090818">
   <title>Flappy-Verity</title>
<style>
     :root
     {
          --brik:https://wallpaper.forfun.com/fetch/10/106b4effcf0694d43bfdde9fe944d25b.jpeg?h=1200&r=0.5;
          --y--bird:50%;
          --scaleX:0.6;
          --color--sidebar:rgba(0,0,0,0.5);
          --text--shadow:3px 2px black;
          --x--barrier:1%;
          --h--wall--top:60%;
          --h--wall--down:70%;
     }


     header
     {
          position:absolute;
          top:0;
          font-family:impact;
          color:#ff0;
          font-size:4vh;
          text-shadow: var(--text--shadow);
     }


     main
     {
          position:relative;
          width:40vw;
          height:70vh;
     }


     body
     {
          font-family:calibri;
          box-shadow:inset 0 0 0 15px black;
          background-color:#000;
          background-size:40px 40px;
          background-size: 40px 40px;
          background-image:
               linear-gradient(to right,rgba(255,0,0,0.5) 10px,transparent 10px),
               linear-gradient(to bottom,rgba(255,0,0,0.5) 10px,transparent 10px);


          display:flex;
          justify-content:center;
          align-items:center;
          height:100vh;
          margin:0;
          color:#fff;
     }



     sidebar
     {
          align-items:center;
          width:max-content;
          padding:0 10px;
          left:20px;
          position:absolute;
          flex-directon:column;
          background-color:var(--color--sidebar);
          backdrop-filter:blur(5px);
          border:5px black solid;
     }



     sidebar > pre
     {
          font-size:15px;
     }



     footer
     {
          color:#ff0;
          justify-content:center;
          align-items:center;
          bottom:-5vh;
          position:absolute;
          flex-direction:column;
          font-family:impact;
          font-size:8vh;
          text-shadow:var(--text--shadow);
     }
     


     #bg-game
     {
          border:5px black solid;
          border-radius:15% 15% 0 0;
          position:absolute;
          z-index:-1;
          top:0;
          width:100%;
          height:100%;
          background-image:
               /*linear-gradient(skyblue,blue);*/
               url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRzXCCo6Ml30j3e9t4hecheMQqRfaNfu7fgqgLNYLDaJg&s=10');
          background-size:cover;
     }


     #grass
     {         
          border-top:5px black solid;
          z-index:1; 
          position:absolute;
          left:0;
          bottom:0;
          height:10%;
          width:100%;
          background-image: 
               linear-gradient(to top,#070,#0F0);
     }



     #bird
     {
          box-shadow: inset -10px -5px 6px #990;
          position:absolute;
          top:var(--y--bird);
          left:17%;
          z-index:2;
          height:5vh;
          width:5vh;
          background-color:yellow;
          border-radius:50%;
          transition: transform 1s;
     }

     iframe{          
	  height:100vh;
	  width:20vw;
          right:20px;
          position:absolute;
     }
     
     #bird::before
     {
          content:"";
          background-color:black;
          border-radius:50%;
          left:15%;
          top:11%;
          width:15%;
          height:30%;
          position:absolute;
     }

     #bird::after 
     {
          content:"";
          background-color:black;
          border-radius:50%;
          right:17%;
          top:11%;
          width:15%;
          height:30%;
          position:absolute;
     }


     #bird > #smile
     {
          background-color:transparent;
          box-shadow: inset 0 -4px 0 1px black;
          border-radius:50%;
          left:20%;
          top:45%;
          width:60%;
          height:50%;
          position:absolute;
     }
     

     #barrier
     {
          position:absolute;
          width:20%;
          height:90%;
          right:var(--x--barrier);
     }
     
     #barrier > #wall_top
     {
          border-radius:20%;
          width:100%;
          position:absolute;
          top:5px;
          height:var(--h--wall--top);
          background-color:white;
          background-image:url(https://wallpaper.forfun.com/fetch/10/106b4effcf0694d43bfdde9fe944d25b.jpeg?h=1200&r=0.5);
     }


     #barrier > #wall_down
     {
          border-radius:20%;
          z-index:-1;
          width:100%;
          position:absolute;
          bottom:0;
          height:var(--h--wall--down);
          background-color:#000;
          background-image:url(https://wallpaper.forfun.com/fetch/10/106b4effcf0694d43bfdde9fe944d25b.jpeg?h=1200&r=0.5);
     }


     #blur
     {
          position:absolute;
          width:100%;
          height:100%;
          z-index:5;
          color:red;
          backdrop-filter:blur(2px);
     }

     
     #pause
     {
          border-radius:50%;
          border:1px black solid;
          background-color:#fff;
          width:5vh;
          height:5vh;
     }

     #pause:active
     {
          background-color:#555;
     }
     

     .jump_play
     {
          animation: jump_anim 0.3s;
     }

     @keyframes jump_anim
     {
          0%
          {
               transform: scaleY(1) scaleX(1);
          }

          100%
          {
               transform: scaleY(0.9) scaleX(var(--scaleX));
          }
     }





     @media (orientation: portrait)
     {

	  html, body 
          {
   	  touch-action: manipulation;
          }

          main
          {
               width:75vw;
               height:80vh;
          }
          
          header
          {
               font-size:3vh;
               top:0;
               width:3vh;
               right:20px;
          }

          footer
          {
               top:26vh;
               width:5vh;
               left:20px;
          }


          #bird     
          {
               height:6vh;
               width:6vh; 
          }

          body
          {
               background-color:#fff;
          }
          
          sidebar
          {
               display:none;
          }
          
     }


     
     

</style>

</head>





<body>


<div id="blur">
     <h1>Нажмите чтобы продолжить</h1>
</div>

<header>
     <button id="pause" onclick="pauseFunction();">||</button>
     <h1>F l a p p y | V e r i t y</h1>
</header>





<main>

<div id="bg-game">
     <div id="grass"></div>
</div>

<div id="bird">
     <div id="smile"></div>
</div>

<div id="barrier">
     <div id="wall_top"></div>
     <div id="wall_down"></div>
</div>

</main>




<sidebar>
     
     <h3>Для прыжка кликните :</h3>

     <pre>
- Space -
- W -
- Numpad8 -
- ArrowUp -
     </pre>


</sidebar>


<footer>
     <p id="score">
          0 0 0
     </p>
</footer>









<script>

     const music = new Audio('verity-song.mp3');
     const but_pause = document.getElementById('pause');
     let pause = false;
     const start_display = document.getElementById('blur');
     let die = false;
     let play = true;
     let step = 0.004;
     let xWall = 0;
     const birdSize = 35;
     let xBarrier = 3;
     let yBird = 50;
     let click = false;
     const jump_button = document.getElementById('jump_but');

     const bird = document.getElementById('bird');
     const wallTop = document.getElementById('wall_top');
     const wallDown = document.getElementById('wall_down');

     const score = document.getElementById('score');
     const style = document.documentElement.style;
     let time = 0;


     music.loop = true;
     music.volume = 0.1;
     airWallSpawn();
     start();
     
     setInterval(()=>{
          if(play)
          {
               chekDie();
               moveBarrier();
               scoreUpdate();
               birdYReplace();
          }else if(!pause){
               start();
          }
     },8);




     document.addEventListener('visibilitychange',()=>{
          if(document.hidden)
          pauseFunction();
     });

    document.addEventListener('click', () => {
          music.play();
    }, { once: true });






     function jump()
     {
          click = true;
          bird.classList.remove('jump_play');
          for (let i = 0;i < 20;i++){
          setTimeout( ()=>{
                    yBird-=1;
                    bird.classList.add('jump_play');
               },4 * (i + 1) );
          }
          click = false;
     } 



          document.addEventListener('mousedown',(e)=>{
               if(e.target.id !== "pause")jump();
          });



          document.addEventListener('keydown',(e)=>{
               if (
               e.code === 'Space' || 
               e.code === 'ArrowUp' || 
               e.code === 'Numpad8' ||
               e.code === 'KeyW'
               ) jump();
          });






     function birdYReplace()
     {
          if (!click) yBird+=0.4;


          if( 2 >= yBird) 
          {
               yBird = 2;
               style.setProperty('--scaleX',"8");
          }else{
               style.setProperty('--scaleX',"0.6");
          }

          if ( yBird >= 83 ) start();

          const y_vh = yBird + "%";

          style.setProperty('--y--bird',y_vh);     
     }





     function scoreUpdate()
     {
          let clear_time = time | 0;
          if (!(time >= 999))
          {
               time +=step;
               clear_time = clear_time + "";
               clear_time = clear_time.padStart('3',"0");
          }else{
               clear_time = "Победа";
          }


          clear_time = clear_time.split("").join(" ");
          score.textContent =  clear_time;
     }




     function airWallSpawn()
     {
          const random = Math.random() * 80;
          let down = random;
          let top = 100 - down - birdSize;
          
          const proc_down = down + "%";
          const proc_top = top + "%";

          style.setProperty('--h--wall--top',proc_top);
          style.setProperty('--h--wall--down',proc_down); 
     }

          function moveBarrier()
          {
               xWall+=step * 100;
               if(xWall >= 79 )
               {
                    airWallSpawn();
                    xWall = 0;
               }

               const xWallProc = xWall + "%";
               
               style.setProperty('--x--barrier',xWallProc);
          }




     function chekDie()
     {
          if(play){
               const birdHit = bird.getBoundingClientRect();
               const wallTopHit = wallTop.getBoundingClientRect();
               const wallDownHit = wallDown.getBoundingClientRect();
               if (checkDieAll(birdHit,wallTopHit) || checkDieAll(birdHit,wallDownHit))play = false;
          }
     }

          function checkDieAll(OneRect,TwoRect)
          {
               return(
                    OneRect.right > TwoRect.left &&
                    OneRect.bottom > TwoRect.top &&
                    OneRect.top < TwoRect.bottom
               ); 
          }




     function start()
     {
          start_display.style.display = "";
          play = false;
          document.addEventListener('click',()=>{
               time = 0;
               xWall = 0;
               airWallSpawn();
               start_display.style.display = "none";
               play = true;
          },{once:true});
     }





     function pauseFunction()
     {
          pause = !pause;
          if(pause){
               but_pause.textContent = "▶";
          }else{
               but_pause.textContent = "||";
          }

          play = !play;
     }






</script>

</body>
</html>
