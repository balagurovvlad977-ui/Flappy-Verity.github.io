<!DOCTYPE html>
<html lang="ru">
<head>
   <meta charset="UTF-8">
   <meta name="author" content="Villager0090818">
   <title>Test web-site</title>
<style>
     :root
     {
          --y--bird:50%;
          --scaleX:0.6;
          --color--sidebar:rgba(0,0,0,0.5);
          --text--shadow:3px 2px black;
     }


     header
     {
          position:absolute;
          top:-3vh;
          font-family:impact;
          color:#ff0;
          font-size:4vh;
          text-shadow: var(--text--shadow);
     }


     main
     {
          position:relative;
          width:30vw;
          height:70vh;
     }


     body
     {
          font-family:calibri;
          box-shadow:inset 0 0 0 15px black;
          background-color:#F88;
          background-size:40px 40px;
          background-size: 40px 40px;
          background-image:
               linear-gradient(to right,rgba(255,0,0,0.5) 10px,transparent 10px),
               linear-gradient(to bottom,rgba(255,0,0,0.5) 10px,transparent 10px);

          display:flex;
          justify-content:center;
          align-items:center;
          height:100vh;
          margin:0;
          color:#fff;
     }



     sidebar
     {
          align-items:center;
          width:max-content;
          padding:0 10px;
          left:20px;
          position:absolute;
          flex-directon:column;
          background-color:var(--color--sidebar);
          backdrop-filter:blur(5px);
          border:5px black solid;
     }



     sidebar > pre
     {
          font-size:15px;
     }



     footer
     {
          align-items:center;
          bottom:-5vh;
          position:absolute;

          font-family:impact;
          font-size:8vh;
          text-shadow:var(--text--shadow);
     }
     


     #bg-game
     {
          border:5px black solid;
          border-radius:50px 50px 0 0;
          position:absolute;
          z-index:-1;
          top:0;
          width:100%;
          height:100%;
          background-image:
               linear-gradient(skyblue,blue);
     }


     #grass
     {         
          border-top:5px black solid;
          z-index:1; 
          position:absolute;
          left:0;
          bottom:0;
          height:10%;
          width:100%;
          background-image: 
               linear-gradient(to top,#070,#0F0);
     }



     #bird
     {
          box-shadow: inset -10px -5px 6px #990;
          position:absolute;
          top:var(--y--bird);
          left:25%;
          z-index:2;
          height:5vh;
          width:5vh;
          background-color:#ff0;
          border-radius:50%;
          transition: transform 1s;
     }

     #bird::before
     {
          content:"";
          background-color:black;
          border-radius:50%;
          left:15%;
          top:11%;
          width:15%;
          height:30%;
          position:absolute;
     }

     #bird::after
     {
          content:"";
          background-color:black;
          border-radius:50%;
          right:17%;
          top:11%;
          width:15%;
          height:30%;
          position:absolute;
     }


     #bird > #smile
     {
          background-color:transparent;
          box-shadow: inset 0 -4px 0 1px black;
          border-radius:50%;
          left:20%;
          top:45%;
          width:60%;
          height:50%;
          position:absolute;
     }

     .jump_play
     {
          animation: jump_anim 0.3s;
     }

     @keyframes jump_anim
     {
          0%
          {
               transform: scaleY(1) scaleX(1);
          }

          100%
          {
               transform: scaleY(0.9) scaleX(var(--scaleX));
          }
     }





     @media (orientation: portrait)
     {
          main
          {
               width:70vw;
               height:80vh;
          }
          
          header
          {
               top:-5vh;
          }

          footer
          {
               bottom:-7.4vh;
          }


          #bird     
          {
               height:6vh;
               width:6vh; 
          }

          body
          {
               background-color:#fff;
          }
          
          sidebar
          {
               display:none;
          }
     }


     
     

</style>

</head>





<body>

<header>
     <h1>F l a p p y - V e r i t y</h1>
</header>





<main>

<div id="bg-game">
     <div id="grass"></div>
</div>

<div id="bird">
     <div id="smile"></div>
</div>

</main>




<sidebar>
     
     <h3>Для прыжка кликните :</h3>

     <pre>
- Space -
- W -
- Numpad8 -
- ArrowUp -
</pre>

</sidebar>




<footer>
     <p id="score">Счёт : 0</p>
</footer>









<script>

     let y = 50;
     let click = false;
     const bird = document.getElementById('bird');
     const score = document.getElementById('score');
     let time = 0;
     
     function jump()
     {
          click = true;
          bird.classList.remove('jump_play');
          for (let i = 0;i < 16;i++){
          setTimeout( ()=>{
                    y-=1;
                    bird.classList.add('jump_play');
               },4 * (i + 1) );
          }
          click = false;
     } 

     document.addEventListener('mousedown',()=>{
          jump();
     });



     document.addEventListener('keydown',(e)=>{
          if (
          e.code === 'Space' || 
          e.code === 'ArrowUp' || 
          e.code === 'Numpad8' ||
          e.code === 'KeyW'
          ) jump();
          console.log(e.code);
     });


     setInterval(()=>{
          if (!click) y+=0.3;
          time +=0.004;

          if( 2 >= y) 
          {
          y = 2;
          document.documentElement.style.setProperty('--scaleX',"8");
          }else{
          document.documentElement.style.setProperty('--scaleX',"0.6");
          }

          if ( y >= 83) y = 83;

          const y_vh = y + "%";
          const clear_time = time | 0;

          score.textContent = "Счёт : " + clear_time;
          document.documentElement.style.setProperty('--y--bird',y_vh);     
     },8);




</script>

</body>
</html>
