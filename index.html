<!DOCTYPE html>
<html lang="ru">
<head>
   <meta charset="UTF-8">
   <meta name="author" content="Villager0090818">
   <title>Test web-site</title>
<style>
     :root
     {
          --y--bird:50%;
          --scaleX:0.6;
     }

     main
     {
          position:relative;
          width:22vw;
          height:70vh;
     }


     body
     {
          box-shadow:inset 0 0 0 15px black;
          background-color:#F88;
          background-size:40px 40px;
          background-size: 40px 40px;
          background-image:
               linear-gradient(to right,rgba(255,0,0,0.5) 10px,transparent 10px),
               linear-gradient(to bottom,rgba(255,0,0,0.5) 10px,transparent 10px);

          display:flex;
          justify-content:center;
          align-items:center;
          height:100vh;
          margin:0;
          color:#fff;
     }
     


     #bg
     {
          border:5px black solid;
          border-radius:50px 50px 0 0;
          position:absolute;
          z-index:-1;
          top:0;
          width:100%;
          height:100%;
          background-image:
               linear-gradient(skyblue,blue);
     }


     #grass
     {         
          border-top:5px black solid;
          z-index:1; 
          position:absolute;
          left:0;
          bottom:0;
          height:10%;
          width:100%;
          background-image: 
               linear-gradient(to top,#070,#0F0);
     }



     #bird
     {
          box-shadow: inset -10px -5px 6px #990;
          position:absolute;
          top:var(--y--bird);
          left:25%;
          z-index:2;
          height:5vh;
          width:5vh;
          background-color:#ff0;
          border-radius:50%;
          transition: transform 1s;
     }

     #bird::before
     {
          content:"";
          background-color:black;
          border-radius:50%;
          left:15%;
          top:11%;
          width:15%;
          height:30%;
          position:absolute;
     }

     #bird::after
     {
          content:"";
          background-color:black;
          border-radius:50%;
          right:17%;
          top:11%;
          width:13%;
          height:30%;
          position:absolute;
     }


     #bird > #smile
     {
          background-color:transparent;
          box-shadow: inset 0 -4px 0 1px black;
          border-radius:50%;
          left:20%;
          top:45%;
          width:60%;
          height:50%;
          position:absolute;
     }

     .jump_play
     {
          animation: jump_anim 0.3s;
     }

     @keyframes jump_anim
     {
          0%
          {
               transform: scaleY(1) scaleX(1);
          }

          100%
          {
               transform: scaleY(0.9) scaleX(var(--scaleX));
          }
     }





     @media (orientation: portrait)
     {
          main
          {
               width:70vw;
               height:90vh;
          }
          
          #bird     
          {
               height:6vh;
               width:6vh;
          }

          body
          {
               background-color:#fff;
          }
     }


     
     

</style>

</head>
<body>


<main>

<div id="bg">
     <div id="grass"></div>
</div>

<div id="bird">
     <div id="smile"></div>
</div>

</main>

<script>

     let y = 50;
     let click = false;
     const bird = document.getElementById('bird');

     function jump()
     {
          click = true;
          bird.classList.remove('jump_play');
          for (let i = 0;i < 11;i++){
          setTimeout( ()=>{
                    y-=1;
                    bird.classList.add('jump_play');
               },4 * (i + 1) );
          }
          click = false;
     } 

     document.addEventListener('mousedown',()=>{
          jump();
     });



     document.addEventListener('keydown',(e)=>{
          if (
          e.code === 'Space' || 
          e.code === 'ArrowUp' || 
          e.code === 'Numpad8' ||
          e.code === 'KeyW'
          ) jump();
          console.log(e.code);
     });


     setInterval(()=>{
          if (!click) y+=0.3;


          if( 2 >= y) 
          {
          y = 2;
          document.documentElement.style.setProperty('--scaleX',"8");
          }else{
          document.documentElement.style.setProperty('--scaleX',"0.6");
          }

          if ( y >= 83) y = 83;

          let y_vh = y + "%";
          document.documentElement.style.setProperty('--y--bird',y_vh);     
     },10);


</script>

</body>
</html>
